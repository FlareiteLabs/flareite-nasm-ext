[package]
name = "nasm"
description = "NASM for Flareite: highlighting, NASM problems, asm-lsp, and symbols."
version = "1.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The editor's repository, checked out beside this one.
flareite-extension-api = { path = "../editor/crates/flareite-extension-api" }
# Reads `.asm-lsp.toml` for its NASM include paths.
toml = { version = "1.1.8", default-features = false, features = [
  "parse",
  "serde",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
